services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CHROMA_DIR: /app/data/chroma
      STRUCTURED_FACTS_PATH: /app/data/structured_facts.json
      TESSERACT_CMD: /usr/bin/tesseract
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/rag-campus/api}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/rag-campus/}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      VITE_BASE_PATH: ${VITE_BASE_PATH:-/rag-campus/}
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - web
    ports:
      - "127.0.0.1:${PUBLIC_HTTP_PORT:-8081}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
